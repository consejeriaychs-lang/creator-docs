<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Escena 0 - Tutorial</title>
    <script src="https://aframe.io"></script>
    <script>
        AFRAME.registerComponent('ir-escena1', {
            init: function () {
                this.el.addEventListener('click', function () {
                    window.location.href = "escena1_ciencia_politica.html";
                });
            }
        });
    </script>
</head>
<body>
    <a-scene cursor="rayOrigin: mouse">
        <!-- Cielo -->
        <a-sky color="#87CEEB"></a-sky>

        <!-- Suelo -->
        <a-plane rotation="-90 0 0" width="300" height="300" color="#7BC8A4"></a-plane>

        <!-- Iluminación -->
        <a-light type="ambient" intensity="1.2"></a-light>

        <!-- Cámara -->
        
            <a-camera>
                <a-cursor color="red"></a-cursor>
            </a-camera>
        

        <!-- Texto principal -->
        <a-text value="RUTA DEL CIUDADANO TRANSFORMADOR" position="0 7 -12" align="center" width="20" color="#003366"></a-text>

        <!-- Caja interactiva para cambiar de escena -->
        <a-box ir-escena1 position="0 3 -10" width="10" height="3" depth="0.5" color="#FFFFFF"></a-box>
    </a-scene>
</body>
</html>
